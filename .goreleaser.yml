version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    binary: creo
    ldflags:
      - -s -w -X github.com/tanmayythakare/creo/internal/ui.Version=v{{.Version}}

archives:
  - format: zip
    name_template: "creo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

scoops:
  - repository:
      owner: tanmayythakare
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_PAT }}"
    directory: bucket
    homepage: "https://github.com/tanmayythakare/creo"
    description: "One command starts all your services in separate Windows Terminal tabs."
    license: MIT

